<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>負片即時反轉</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#eee;font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:#000;touch-action:none}
#cv{width:100%;height:100%;object-fit:contain;display:block}
#cv.fill{object-fit:cover}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
#msg{font-size:13px;color:#f90;max-width:300px}
button{font:inherit;color:#fff;background:rgba(255,255,255,.16);border:0;border-radius:20px;padding:10px 14px;cursor:pointer}
button.on,button.pri{background:#2f7cf6}
#bar{position:absolute;left:0;right:0;bottom:0;padding:24px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.65))}
#bar button.side{min-width:76px}
#snap{width:76px;height:76px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.45);background-clip:padding-box;padding:0}
#snap:active{background:#ccc}
#ring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid #ffd60a;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .3s}
#panel{touch-action:pan-y;position:absolute;left:10px;right:10px;bottom:calc(112px + env(safe-area-inset-bottom,0px));max-height:55%;overflow:auto;background:rgba(18,18,18,.9);border-radius:16px;padding:12px;display:none;flex-direction:column;gap:10px}
#panel.open{display:flex}
.row{display:flex;gap:8px;align-items:center}
.row label{font-size:13px;color:#bbb;width:48px;flex:none}
.row input[type=range]{flex:1;min-width:0}
.row button{flex:1;padding:9px 6px;font-size:14px}
#hint{font-size:12px;color:#aaa;margin:0}
#shot{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:5}
#shot img{max-width:100%;max-height:70%;object-fit:contain}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="640" height="480"></canvas>
  <div id="ring"></div>
  <div id="start">
    <div style="font-size:42px">🎞️</div>
    <div>把底片放在燈箱上，開啟相機即可看到正片</div>
    <button class="pri" id="startBtn">開啟相機</button>
    <div id="msg"></div>
  </div>
  <div id="panel">
    <div class="row">
      <button id="mBw" class="on">黑白</button>
      <button id="mCo">彩色</button>
      <button id="auto">自動色階</button>
    </div>
    <div class="row"><label>黑點</label><input id="sb" type="range" min="0" max="0.5" step="0.005" value="0"></div>
    <div class="row"><label>白點</label><input id="sw" type="range" min="0.5" max="1" step="0.005" value="1"></div>
    <div class="row"><label>Gamma</label><input id="sg" type="range" min="0.4" max="2.5" step="0.05" value="1"></div>
    <div class="row" id="zRow" style="display:none"><label>變焦</label><input id="sz" type="range"></div>
    <div class="row" id="fRow" style="display:none"><label>對焦</label><input id="sf" type="range"></div>
    <div class="row"><button id="samp">取樣片基（再點空白處）</button></div>
    <div class="row">
      <button id="flip">左右翻轉</button>
      <button id="fill">填滿畫面</button>
      <button id="reset">重設</button>
    </div>
    <p id="hint">點畫面可重新對焦。要校正色偏，按「取樣片基」再點底片上沒有影像的空白處。手機橫放，畫面會更大。</p>
  </div>
  <div id="bar">
    <button id="tune" class="side">調整</button>
    <button id="snap" aria-label="拍照"></button>
    <button id="rot" class="side">旋轉</button>
  </div>
</div>
<div id="shot">
  <img id="shotImg" alt="">
  <div class="row" style="width:100%;max-width:360px">
    <button id="share" class="pri">分享／儲存</button>
    <button id="close">關閉</button>
  </div>
  <div style="color:#aaa;font-size:12px">也可以長按圖片儲存</div>
</div>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', {willReadFrequently:true});
const video = document.createElement('video');
video.playsInline = true; video.muted = true;
const S = {mode:'bw', black:0, white:1, gamma:1, rot:0, flip:false, fill:false, base:[255,255,255], auto:false, sample:null};
let blobCache = null;
let track = null, caps = {};
S.dz = 1;

async function start(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
    video.srcObject = stream;
    await video.play();
    track = stream.getVideoTracks()[0];
    setupCaps();
    $('start').style.display = 'none';
    loop();
  }catch(e){
    $('msg').textContent = '無法開啟相機：' + (e.message || e.name) + '（需要 HTTPS 並允許相機權限）';
  }
}

async function setupCaps(){
  try{
    caps = track.getCapabilities ? track.getCapabilities() : {};
    const st = track.getSettings ? track.getSettings() : {};
    if(caps.focusMode && caps.focusMode.includes('continuous'))
      await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
    if(caps.zoom){
      const z = $('sz'); z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step || 0.1;
      z.value = st.zoom || caps.zoom.min; $('zRow').style.display = 'flex';
      z.oninput = () => track.applyConstraints({advanced:[{zoom:+z.value}]}).catch(()=>{});
    }
    if(!caps.zoom){
      const z = $('sz'); z.min = 1; z.max = 5; z.step = 0.05; z.value = 1; $('zRow').style.display = 'flex';
      z.oninput = () => { S.dz = +z.value; };
    }
    if(caps.focusDistance){
      const f = $('sf'); f.min = caps.focusDistance.min; f.max = caps.focusDistance.max; f.step = caps.focusDistance.step || 0.01;
      f.value = st.focusDistance || caps.focusDistance.min; $('fRow').style.display = 'flex';
      f.oninput = () => track.applyConstraints({advanced:[{focusMode:'manual', focusDistance:+f.value}]}).catch(()=>{});
    }
  }catch(e){}
}
async function tapFocus(){
  if(!track || !caps.focusMode) return;
  try{
    const m = caps.focusMode.includes('single-shot') ? 'single-shot' : 'continuous';
    await track.applyConstraints({advanced:[{focusMode:m}]});
    if(m === 'single-shot') setTimeout(() => track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{}), 1500);
  }catch(e){}
}
function ring(x,y){
  const g = $('ring'); g.style.left = x+'px'; g.style.top = y+'px'; g.style.opacity = 1;
  setTimeout(() => { g.style.opacity = 0; }, 700);
}

function lut(){
  const t = new Uint8ClampedArray(256), r = Math.max(0.01, S.white - S.black);
  for(let i=0;i<256;i++){
    let v = (i/255 - S.black)/r;
    v = Math.min(1, Math.max(0, v));
    t[i] = Math.pow(v, 1/S.gamma)*255;
  }
  return t;
}

function render(maxSide, out){
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw) return false;
  const swap = S.rot % 2 === 1;
  const w = swap ? vh : vw, h = swap ? vw : vh;
  const sc = Math.min(1, maxSide / Math.max(w,h));
  const ow = Math.round(w*sc), oh = Math.round(h*sc);
  if(out.width !== ow || out.height !== oh){ out.width = ow; out.height = oh; }
  const c = out.getContext('2d', {willReadFrequently:true});
  c.save();
  c.translate(ow/2, oh/2);
  c.rotate(S.rot * Math.PI/2);
  c.scale(S.dz, S.dz);
  c.scale(S.flip ? -1 : 1, 1);
  c.drawImage(video, -vw*sc/2, -vh*sc/2, vw*sc, vh*sc);
  c.restore();
  const img = c.getImageData(0,0,ow,oh), d = img.data, n = d.length;

  if(S.sample){
    const {x,y} = S.sample; S.sample = null;
    let r=0,g=0,b=0,k=0;
    for(let yy=Math.max(0,y-4); yy<=Math.min(oh-1,y+4); yy++)
      for(let xx=Math.max(0,x-4); xx<=Math.min(ow-1,x+4); xx++){
        const i=(yy*ow+xx)*4; r+=d[i]; g+=d[i+1]; b+=d[i+2]; k++;
      }
    S.base = [Math.max(20,r/k), Math.max(20,g/k), Math.max(20,b/k)];
  }
  const kr = 255/S.base[0], kg = 255/S.base[1], kb = 255/S.base[2];
  const bw = S.mode === 'bw';

  if(S.auto){
    const hist = new Uint32Array(256); let cnt = 0;
    for(let i=0;i<n;i+=16){
      const R = Math.min(255,d[i]*kr), G = Math.min(255,d[i+1]*kg), B = Math.min(255,d[i+2]*kb);
      hist[255 - Math.round(0.299*R+0.587*G+0.114*B)]++; cnt++;
    }
    let acc = 0, lo = 0, hi = 255;
    for(let i=0;i<256;i++){ acc += hist[i]; if(acc >= cnt*0.005){ lo = i; break; } }
    acc = 0;
    for(let i=255;i>=0;i--){ acc += hist[i]; if(acc >= cnt*0.005){ hi = i; break; } }
    if(hi - lo < 10){ lo = 0; hi = 255; }
    S.black = lo/255; S.white = hi/255; S.auto = false;
    $('sb').value = S.black; $('sw').value = S.white;
  }

  const L = lut();
  for(let i=0;i<n;i+=4){
    const R = Math.min(255,d[i]*kr), G = Math.min(255,d[i+1]*kg), B = Math.min(255,d[i+2]*kb);
    if(bw){
      const v = L[255 - Math.round(0.299*R+0.587*G+0.114*B)];
      d[i]=d[i+1]=d[i+2]=v;
    }else{
      d[i]=L[255-Math.round(R)]; d[i+1]=L[255-Math.round(G)]; d[i+2]=L[255-Math.round(B)];
    }
  }
  c.putImageData(img,0,0);
  return true;
}

function loop(){
  render(1280, cv);
  requestAnimationFrame(loop);
}

$('startBtn').onclick = start;
const setMode = m => { S.mode = m; $('mBw').classList.toggle('on', m==='bw'); $('mCo').classList.toggle('on', m==='co'); };
$('mBw').onclick = () => setMode('bw');
$('mCo').onclick = () => setMode('co');
$('auto').onclick = () => { S.auto = true; };
$('sb').oninput = e => S.black = +e.target.value;
$('sw').oninput = e => S.white = +e.target.value;
$('sg').oninput = e => S.gamma = +e.target.value;
$('rot').onclick = () => { S.rot = (S.rot+1) % 4; };
$('flip').onclick = () => { S.flip = !S.flip; $('flip').classList.toggle('on', S.flip); };
$('fill').onclick = () => { S.fill = !S.fill; cv.classList.toggle('fill', S.fill); $('fill').classList.toggle('on', S.fill); };
$('tune').onclick = () => { const o = $('panel').classList.toggle('open'); $('tune').classList.toggle('on', o); };
$('reset').onclick = () => {
  Object.assign(S, {black:0, white:1, gamma:1, base:[255,255,255], auto:false});
  $('sb').value = 0; $('sw').value = 1; $('sg').value = 1;
};

const ptrs = new Map(); let pinch = null, lastPinch = 0, zBusy = false;
function pdist(){ const v = [...ptrs.values()]; return Math.hypot(v[0][0]-v[1][0], v[0][1]-v[1][1]) || 1; }
function curZoom(){ return caps.zoom ? +$('sz').value : S.dz; }
function setZoom(z){
  if(caps.zoom){
    z = Math.min(caps.zoom.max, Math.max(caps.zoom.min, z)); $('sz').value = z;
    if(zBusy) return; zBusy = true;
    track.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{}).finally(() => { zBusy = false; });
  }else{
    S.dz = Math.min(5, Math.max(1, z)); $('sz').value = S.dz;
  }
}
cv.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if(ptrs.size === 2) pinch = {d: pdist(), z: curZoom()};
});
cv.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if(ptrs.size === 2 && pinch){ lastPinch = Date.now(); setZoom(pinch.z * pdist() / pinch.d); }
});
const endPtr = e => { ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch = null; };
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);

cv.addEventListener('click', e => {
  if(Date.now() - lastPinch < 400) return;
  const r = cv.getBoundingClientRect();
  const s = S.fill ? Math.max(r.width/cv.width, r.height/cv.height) : Math.min(r.width/cv.width, r.height/cv.height);
  const x = (e.clientX - r.left - (r.width - cv.width*s)/2)/s;
  const y = (e.clientY - r.top - (r.height - cv.height*s)/2)/s;
  if(S.arm){
    if(x>=0 && y>=0 && x<cv.width && y<cv.height) S.sample = {x:Math.round(x), y:Math.round(y)};
    S.arm = false; $('samp').classList.remove('on');
  }else{
    ring(e.clientX, e.clientY); tapFocus();
  }
});
$('samp').onclick = () => { S.arm = !S.arm; $('samp').classList.toggle('on', S.arm); };

$('snap').onclick = () => {
  const tmp = document.createElement('canvas');
  if(!render(4096, tmp)) return;
  tmp.toBlob(b => {
    blobCache = b;
    $('shotImg').src = URL.createObjectURL(b);
    $('shot').style.display = 'flex';
  }, 'image/png');
};
$('close').onclick = () => { $('shot').style.display = 'none'; };
$('share').onclick = async () => {
  if(!blobCache) return;
  const f = new File([blobCache], 'positive-' + Date.now() + '.png', {type:'image/png'});
  try{
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; }
  }catch(e){ return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blobCache); a.download = f.name; a.click();
};
</script>
</body>
</html>
